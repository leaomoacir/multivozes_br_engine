services:
  openvoice:
    build: .
    container_name: openvoice_br_engine
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      API_KEY: ${API_KEY:-}
      REQUIRE_API_KEY: ${REQUIRE_API_KEY:-false}
      PORT: "${PORT:-5050}"
      HOST: "0.0.0.0"
      TTS_ENGINE: ${TTS_ENGINE:-auto}
      DEFAULT_VOICE: ${DEFAULT_VOICE:-pt-BR-ThalitaMultilingualNeural}
      DEFAULT_RESPONSE_FORMAT: ${DEFAULT_RESPONSE_FORMAT:-mp3}
      DEFAULT_SPEED: ${DEFAULT_SPEED:-1.0}
      DEFAULT_GTTS_LANG: ${DEFAULT_GTTS_LANG:-pt}
      DEFAULT_GTTS_TLD: ${DEFAULT_GTTS_TLD:-com.br}
      PROXY: ${PROXY:-}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-5050}:5050"
    volumes:
      - ./voices.json:/app/voices.json:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    stop_grace_period: 100s
    networks:
      - default

networks:
  default:
    name: ${DOCKER_NETWORK:-openvoice_net}
    driver: bridge
